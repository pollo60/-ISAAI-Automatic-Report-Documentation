name: File Sync Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  sync-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Validate critical files exist
        run: |
          critical_files=(
            "README.md"
            "docs/Documentation/"
            "docs/guides/"
            "src/"
            "scripts/"
            "presentations/"
          )
          for file in "${critical_files[@]}"; do
            if [ ! -e "$file" ]; then
              echo "Missing: $file"
              exit 1
            fi
          done
          echo "All critical paths present"

      - name: Validate documentation structure
        run: |
          required_docs=(
            "docs/Documentation/Architecture/"
            "docs/Documentation/Process Modeling/"
            "docs/Documentation/Architecture/CURRENT Architecture/"
            "docs/Documentation/Architecture/VISION Architecture/"
            "docs/Documentation/Architecture/GOAL Architecture/"
            "docs/guides/SHAREPOINT_FLOW_GUIDE.md"
          )
          for doc in "${required_docs[@]}"; do
            if [ ! -e "$doc" ]; then
              echo "Documentation missing: $doc"
              exit 1
            fi
          done
          echo "Documentation structure valid"

      - name: Validate flow package
        run: |
          if ls src/flow/ISAAI*.zip 1>/dev/null 2>&1; then
            echo "Flow package found"
          else
            echo "Missing Power Automate flow package"
            exit 1
          fi

      - name: Validate JSON files
        run: |
          for f in $(find src/flow -name "*.json" -not -path "*/\.*"); do
            python3 -c "import json; json.load(open('$f'))" || { echo "Invalid JSON: $f"; exit 1; }
          done
          echo "All JSON files valid"

      - name: Sync check report
        if: success()
        run: echo "Repository structure validated"
