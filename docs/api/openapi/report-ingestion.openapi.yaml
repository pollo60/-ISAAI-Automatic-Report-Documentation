openapi: 3.0.3
info:
  title: ISAAI Report Ingestion API (Mock)
  description: Mock XML report intake for A+I module — not production.
  version: 0.1.0
servers:
  - url: https://sandbox.example.internal/api/v1
    description: Stakeholder sandbox (TBD)
security:
  - bearerAuth: []
paths:
  /reports/ingest:
    post:
      operationId: ingestReport
      summary: Ingest daily XML report package
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRequest'
            examples:
              reportTypeA:
                value:
                  reportType: DAILY_VIOL
                  businessDate: "2026-05-29"
                  payloadBase64: "<base64-xml-mock>"
      responses:
        '202':
          description: Accepted for validation
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestAccepted'
              examples:
                accepted:
                  value:
                    jobId: "job-7f3a2c91"
                    status: QUEUED
                    sourceHash: "sha256:mockhash0001"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    XRequestId:
      name: X-Request-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    IngestRequest:
      type: object
      required: [reportType, businessDate, payloadBase64]
      properties:
        reportType:
          type: string
          enum: [DAILY_VIOL, MONTHLY_VIOL]
        businessDate:
          type: string
          format: date
        payloadBase64:
          type: string
    IngestAccepted:
      type: object
      properties:
        jobId:
          type: string
        status:
          type: string
          enum: [QUEUED]
        sourceHash:
          type: string
    ErrorBody:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          example:
            code: unauthorized
            message: Bearer token required
    Unprocessable:
      description: Schema validation failed
      content:
        application/json:
          example:
            code: invalid_payload
            message: reportType not supported
    ServerError:
      description: Internal error
      content:
        application/json:
          example:
            code: internal_error
            message: Ingest service unavailable
